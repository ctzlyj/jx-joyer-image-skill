[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "jx-joyer-image-skill"
version = "0.1.0"
description = "Codex skill and Python CLI for JD Oxygen ecommerce image workflows"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "CTctikki" }]
dependencies = [
  "httpx>=0.27,<1",
  "Pillow>=10,<12",
  "pydantic>=2.8,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "PyYAML>=6,<7"]

[project.scripts]
jx-joyer = "jx_joyer.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
